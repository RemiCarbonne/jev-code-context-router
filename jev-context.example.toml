# All paths are examples. The router discovers Git repositories dynamically.
workspace_roots = ["~/code"]
model = "jev-latest"
endpoint = "https://api.typesafe.ai/v1/systemone"
max_context_chars = 12000
shortlist_size = 20
max_selected = 4
local_fallback_selected = 2
repository_confidence = 0.58

# Optional aliases. They never grant access outside workspace_roots.
[repository_aliases]
web = "~/code/acme-web"
api = "~/code/acme-api"
